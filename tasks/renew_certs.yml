---

- name: Check certificate expiration status
  ansible.builtin.command:
    cmd: >
      {{ smallstep_bin_dir }}/bin/step certificate inspect
      "{{ smallstep_www_certs_dir }}/{{ item.name }}/{{ item.name }}.crt"
      --format json
  loop: "{{ smallstep_certificates }}"
  loop_control:
    label: "{{ item.name }}"
  register: cert_expiry_check
  changed_when: false
  failed_when: false
  environment:
    STEPPATH: "{{ smallstep_ca_dir }}"

- name: Parse certificate expiration dates
  ansible.builtin.set_fact:
    cert_renewal_status: >-
      {{
        cert_renewal_status | default([]) +
        [{
          'name': item.item.name,
          'cert_item': item.item,
          'expires_at': (item.stdout | from_json).validity.end,
          'days_until_expiry': (((((item.stdout | from_json).validity.end | to_datetime('%Y-%m-%dT%H:%M:%SZ')).timestamp() | int) - (ansible_date_time.epoch | int)) / 86400) | round(1),
          'needs_renewal': ((((item.stdout | from_json).validity.end | to_datetime('%Y-%m-%dT%H:%M:%SZ')).timestamp() | int) - (ansible_date_time.epoch | int)) < ((smallstep_renewal_threshold | default(30)) | int * 86400)
        }]
      }}
  loop: "{{ cert_expiry_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc == 0

- name: Display certificates needing renewal
  ansible.builtin.debug:
    msg: >-
      {{ item.name }} expires at {{ item.expires_at }}
      ({{ item.days_until_expiry }} days), renewal needed: {{ item.needs_renewal }}
  loop: "{{ cert_renewal_status | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create backup directories for old certificates
  ansible.builtin.file:
    path: "{{ smallstep_www_certs_dir }}/{{ item.name }}/old/{{ ansible_date_time.date }}-{{ ansible_date_time.time | replace(':', '-') }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ cert_renewal_status | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.needs_renewal | bool

- name: Create backup directories for old private keys
  ansible.builtin.file:
    path: "{{ smallstep_issued_dir }}/{{ item.name }}/old/{{ ansible_date_time.date }}-{{ ansible_date_time.time | replace(':', '-') }}"
    state: directory
    owner: "{{ item.cert_item.owner | default('root') }}"
    group: "{{ item.cert_item.group | default('root') }}"
    mode: "0700"
  loop: "{{ cert_renewal_status | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.needs_renewal | bool

- name: Copy existing certificates to the backup directory
  ansible.builtin.copy:
    src: "{{ smallstep_www_certs_dir }}/{{ item.name }}/{{ item.name }}.crt"
    dest: "{{ smallstep_www_certs_dir }}/{{ item.name }}/old/{{ ansible_date_time.date }}-{{ ansible_date_time.time | replace(':', '-') }}/{{ item.name }}.crt"
    owner: root
    group: root
    mode: "{{ item.cert_item.cert_mode | default('0644') }}"
    remote_src: true
  loop: "{{ cert_renewal_status | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.needs_renewal | bool

- name: Copy existing private keys to the backup directory
  ansible.builtin.copy:
    src: "{{ smallstep_issued_dir }}/{{ item.name }}/{{ item.name }}.key"
    dest: "{{ smallstep_issued_dir }}/{{ item.name }}/old/{{ ansible_date_time.date }}-{{ ansible_date_time.time | replace(':', '-') }}/{{ item.name }}.key"
    owner: "{{ item.cert_item.owner | default('root') }}"
    group: "{{ item.cert_item.group | default('root') }}"
    mode: "{{ item.cert_item.key_mode | default('0600') }}"
    remote_src: true
  loop: "{{ cert_renewal_status | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.needs_renewal | bool

- name: Renew certificates using the step ca renew command
  ansible.builtin.command:
    cmd: >
      {{ smallstep_bin_dir }}/bin/step ca renew
      "{{ smallstep_www_certs_dir }}/{{ item.name }}/{{ item.name }}.crt"
      "{{ smallstep_issued_dir }}/{{ item.name }}/{{ item.name }}.key"
      --ca-url "{{ smallstep_ca_server_url }}"
      --force
  environment:
    STEPPATH: "{{ smallstep_ca_dir }}"
  loop: "{{ cert_renewal_status | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.needs_renewal | bool
  register: cert_renewal_result
  failed_when: false

- name: Reissue certificates when renewal fails
  ansible.builtin.command:
    cmd: >
      {{ smallstep_bin_dir }}/bin/step ca certificate
      "{{ item.item.cert_item.common_name }}"
      "{{ smallstep_www_certs_dir }}/{{ item.item.name }}/{{ item.item.name }}.crt"
      "{{ smallstep_issued_dir }}/{{ item.item.name }}/{{ item.item.name }}.key"
      --provisioner "{{ item.item.cert_item.provisioner | default(smallstep_ca_provisioner) }}"
      --provisioner-password-file "{{ smallstep_ca_password_file }}"
      --ca-url "{{ smallstep_ca_server_url }}"
      --root "{{ smallstep_ca_certs_dir }}/root_ca.crt"
      {% if item.item.cert_item.san is defined and item.item.cert_item.san | length > 0 %}
      {% for san_entry in item.item.cert_item.san %}
      --san "{{ san_entry }}"
      {% endfor %}
      {% endif %}
      --not-after "{{ item.item.cert_item.validity | default('8760h') }}"
      --force
  environment:
    STEPPATH: "{{ smallstep_ca_dir }}"
  loop: "{{ cert_renewal_result.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.item.needs_renewal | bool
    - item.rc != 0

- name: Recreate fullchain certificates (certificate, intermediate and root only)
  ansible.builtin.shell: |
    cat "{{ smallstep_www_certs_dir }}/{{ item.name }}/{{ item.name }}.crt" \
        "{{ smallstep_ca_certs_dir }}/intermediate_ca.crt" \
        "{{ smallstep_ca_certs_dir }}/root_ca.crt" \
        > "{{ smallstep_www_certs_dir }}/{{ item.name }}/{{ item.name }}-fullchain.crt"
  loop: "{{ cert_renewal_status | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.needs_renewal | bool

- name: Verify the renewed certificates
  ansible.builtin.command:
    cmd: >
      {{ smallstep_bin_dir }}/bin/step certificate verify
      "{{ smallstep_www_certs_dir }}/{{ item.name }}/{{ item.name }}.crt"
      --roots "{{ smallstep_ca_certs_dir }}/root_ca.crt"
  environment:
    STEPPATH: "{{ smallstep_ca_dir }}"
  loop: "{{ cert_renewal_status | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.needs_renewal | bool
  register: renewed_cert_verify_result
  changed_when: false

- name: Get renewed certificate information
  ansible.builtin.command:
    cmd: >
      {{ smallstep_bin_dir }}/bin/step certificate inspect
      "{{ smallstep_www_certs_dir }}/{{ item.name }}/{{ item.name }}.crt"
      --format json
  loop: "{{ cert_renewal_status | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.needs_renewal | bool
  register: renewed_cert_info_result
  changed_when: false

- name: Update the certificate info file for renewed certificates
  ansible.builtin.template:
    src: info/cert_info.txt.j2
    dest: "{{ smallstep_www_certs_dir }}/{{ item.item.name }}/cert_info.txt"
    owner: root
    group: root
    mode: "0644"
  vars:
    cert_item: "{{ item.item.cert_item }}"
    cert_details: "{{ item.stdout | from_json }}"
  loop: "{{ renewed_cert_info_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.skipped is not defined

- name: Restart the services that consume renewed certificates
  ansible.builtin.systemd:
    name: "{{ item.cert_item.service_name }}"
    state: restarted
  loop: "{{ cert_renewal_status | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.needs_renewal | bool
    - item.cert_item.service_name is defined

- name: Clean up old certificate backups (keep the last 5)
  ansible.builtin.shell: |
    cd "{{ smallstep_www_certs_dir }}/{{ item.name }}/old" && \
    ls -dt */ 2>/dev/null | tail -n +6 | xargs -r rm -rf
  loop: "{{ cert_renewal_status | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.needs_renewal | bool
    - smallstep_cleanup_old_backups | default(true) | bool

- name: Clean up old private key backups (keep the last 5)
  ansible.builtin.shell: |
    cd "{{ smallstep_issued_dir }}/{{ item.name }}/old" && \
    ls -dt */ 2>/dev/null | tail -n +6 | xargs -r rm -rf
  loop: "{{ cert_renewal_status | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.needs_renewal | bool
    - smallstep_cleanup_old_backups | default(true) | bool
